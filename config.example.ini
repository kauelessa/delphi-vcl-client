; Copie este arquivo para config.ini (que não é versionado), ao lado do executável.
; Os endereços abaixo são exemplos.

[Api]
; perfis separados por vírgula; cada um tem a seção [Perfil.<nome>]
Perfis=Local,Servidor
TimeoutSegundos=15
[Perfil.Local]
Url=http://localhost:9000
[Perfil.Servidor]
Url=http://servidor.exemplo.com.br:9000
[Health]
IntervaloSegundos=30
[Log]
Pasta=.\logs
Http=1
RetencaoDias=30
